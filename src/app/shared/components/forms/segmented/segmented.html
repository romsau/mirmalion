<!--
  `aria-pressed` plutôt que `role="radio"` : ce sont des boutons à bascule dans un groupe, et
  c'est ce que la maquette dessine. Un groupe de radios imposerait une navigation aux flèches
  et un seul arrêt de tabulation, ce qui n'est pas le comportement rendu.
-->
<div class="seg" role="group" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="seg-btn"
      [class.is-active]="value() === option.value"
      [attr.aria-pressed]="value() === option.value"
      (click)="value.set(option.value)"
    >
      @if (option.icon; as name) {
        <app-icon [name]="name" />
      }
      {{ option.label }}
    </button>
  }
</div>
